# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.0-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:nightly-2026080308ubu2604-ls93
          resources:
            requests:
              cpu: 6000m
              memory: 4Gi
            limits:
              cpu: 10000m
              memory: 8Gi
          livenessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 0
            timeoutSeconds: 5
            failureThreshold: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8096
            initialDelaySeconds: 0
            timeoutSeconds: 5
            failureThreshold: 60
            periodSeconds: 20
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            # - name: DOCKER_MODS
            #   value: "linuxserver/mods:jellyfin-opencl-intel"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: data
              mountPath: /config
            - name: library
              mountPath: /library
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-jellyfin
        - name: library
          persistentVolumeClaim:
            claimName: library
      restartPolicy: Always
